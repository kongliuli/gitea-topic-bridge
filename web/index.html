<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多仓联调 · Gitea Topic Bridge</title>
  <link rel="stylesheet" href="/bridge/style.css">
  <script type="module" src="/bridge/app.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="label">GITEA TOPIC BRIDGE</p>
      <h1>多仓联调</h1>
      <p>用一个需求编号查看各仓的合并请求。审批和合并仍在 Gitea 完成。</p>
    </header>
    <div class="account">
      <a id="login" href="/bridge/auth/login" hidden>用 Gitea 登录</a>
      <span id="account-name"></span>
      <button id="logout" type="button" hidden>退出看板</button>
    </div>
    <form id="lookup" hidden>
      <label>项目组 <select name="project_id" required></select></label>
      <label>需求编号 <input name="topic" placeholder="CAD-TOL-01" pattern="[A-Z0-9][A-Z0-9\-]{0,63}" maxlength="64" required></label>
      <button type="submit">查询</button>
    </form>
    <p id="message" role="status">正在读取登录状态…</p>
    <section id="results" aria-label="逐仓结果"></section>
    <noscript>此看板需要启用 JavaScript。</noscript>
  </main>
</body>
</html>
